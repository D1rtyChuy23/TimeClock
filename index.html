<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#24527f">
<title>Team Time Clock</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600;700&display=swap">
<style>
/* Layout: one narrow column like a time card; admins get a second "Team" tab. */
:root{
  --bg:#e9eef2; --surface:#ffffff; --ink:#16212c; --muted:#5a6876; --line:#d2dae2;
  --brand:#24527f; --in:#18794a; --in-ink:#ffffff; --out:#b02a1f; --out-ink:#ffffff;
  --warn-bg:#fff2cc; --warn:#7a5600; --soft:#f3f6f9;
  --f-display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#0f161d; --surface:#18222c; --ink:#e6edf3; --muted:#9aa9b7; --line:#2b3846;
  --brand:#7fb0e0; --in:#2fa36a; --in-ink:#06150d; --out:#e0645a; --out-ink:#1d0605;
  --warn-bg:#3a2f10; --warn:#f2cf73; --soft:#1e2a35; color-scheme:dark}}
*{box-sizing:border-box}
html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 var(--f-body);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 40px}
[hidden]{display:none!important}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.hd-right{display:flex;gap:6px}
h1{font:700 26px/1 var(--f-display);letter-spacing:.02em;text-transform:uppercase;margin:0}
h2{font:600 19px/1.2 var(--f-display);letter-spacing:.04em;text-transform:uppercase;margin:0 0 10px;color:var(--muted)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border-radius:10px;border:1px solid var(--line);background:var(--surface);padding:10px 14px;min-height:44px}
button:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
.tabs{display:flex;gap:6px}
.tabs button{flex:1;font-weight:600}
.tabs button[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px}
.timecard{border:2px dashed var(--line);text-align:center;display:flex;flex-direction:column;gap:10px;padding:22px 16px}
.hello{font-weight:600;color:var(--muted)}
.now{font:600 56px/1 var(--f-display);font-variant-numeric:tabular-nums}
.date{color:var(--muted);margin-top:-4px}
.status{font-weight:600}
.big{min-height:84px;border:0;border-radius:16px;font:700 32px/1 var(--f-display);letter-spacing:.06em;text-transform:uppercase}
.big.in{background:var(--in);color:var(--in-ink)}
.big.out{background:var(--out);color:var(--out-ink)}
.big:disabled{opacity:.6}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center}
.stat b{display:block;font:600 28px/1.1 var(--f-display);font-variant-numeric:tabular-nums}
.stat span{font-size:13px;color:var(--muted)}
form{display:grid;grid-template-columns:1fr 1fr;gap:10px}
form .full{grid-column:1/-1}
label{display:flex;flex-direction:column;gap:4px;font-size:14px;color:var(--muted);min-width:0}
input,select{border:1px solid var(--line);border-radius:10px;background:var(--soft);padding:10px;min-height:44px;width:100%}
.primary{background:var(--brand);color:var(--surface);border-color:var(--brand);font-weight:600}
.link{background:none;border:0;color:var(--brand);text-decoration:underline;padding:6px;min-height:0}
ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
li{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-top:1px solid var(--line);flex-wrap:wrap}
li:first-child{border-top:0}
li .main{min-width:0;flex:1}
li .sub{font-size:14px;color:var(--muted)}
.num{font-variant-numeric:tabular-nums;font-weight:600;white-space:nowrap}
.pill{display:inline-block;font-size:12px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;padding:3px 8px;border-radius:99px;background:var(--soft);color:var(--muted)}
.pill.on,.pill.approved{background:var(--in);color:var(--in-ink)}
.pill.pending{background:var(--warn-bg);color:var(--warn)}
.pill.denied{background:var(--out);color:var(--out-ink)}
.row-btns{display:flex;gap:6px;flex-shrink:0}
.small{min-height:36px;padding:6px 10px;font-size:14px}
.danger{color:var(--out);border-color:var(--out)}
.danger.armed{background:var(--out);color:var(--out-ink)}
.empty{color:var(--muted);margin:0}
.team li{cursor:pointer}
.team li:hover .main b{text-decoration:underline}
.auth{max-width:420px;width:100%;margin:6vh auto 0}
.auth form{grid-template-columns:1fr}
.auth .switch{text-align:center;margin-top:8px}
.note{font-size:14px;color:var(--muted);margin:0}
.notice{display:flex;gap:12px;align-items:center;background:var(--warn-bg);color:var(--warn);border-radius:14px;padding:14px 16px;font-weight:600}
.notice b{font:700 30px/1 var(--f-display);font-variant-numeric:tabular-nums;flex-shrink:0}
.notice .sub{font-weight:400}
.msg{padding:28px 16px;text-align:center;color:var(--muted)}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:10px 18px;border-radius:99px;font-weight:600;max-width:calc(100% - 32px);text-align:center}
body[data-busy="saving"] button{cursor:progress}
@media (max-width:420px){.now{font-size:46px}.stat b{font-size:24px}}
@media (prefers-reduced-motion:no-preference){.big{transition:transform .08s}.big:active{transform:scale(.98)}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1 data-t="title"></h1>
    <div class="hd-right">
      <button id="btn-lang" data-act="lang" style="font-weight:600"></button>
      <button id="btn-out" data-act="signout" data-t="signOut" hidden></button>
    </div>
  </header>

  <p class="msg" id="msg" data-t="loading"></p>

  <!-- first load failed -->
  <section id="v-error" class="card auth" role="alert" hidden>
    <h2 data-t="cantLoadH"></h2>
    <p class="note" data-t="cantLoad"></p>
    <div class="row-btns" style="margin-top:14px">
      <button class="primary" data-act="retry" data-t="retry"></button>
      <button data-act="signout" data-t="signOut"></button>
    </div>
  </section>

  <div class="notice" id="sync-notice" role="status" data-t="stale" hidden></div>

  <!-- sign in / sign up / reset -->
  <section id="v-auth" class="card auth" hidden>
    <h2 id="auth-h"></h2>
    <form id="f-auth">
      <label id="lbl-name"><span data-t="fullName"></span><input id="a-name" autocomplete="name" maxlength="60"></label>
      <label id="lbl-email"><span data-t="email"></span><input id="a-email" type="email" autocomplete="email"></label>
      <label id="lbl-pass"><span data-t="password"></span><input id="a-pass" type="password" minlength="8" autocomplete="current-password"></label>
      <button class="primary" id="a-submit"></button>
      <p class="note" id="a-note"></p>
    </form>
    <div class="switch">
      <button class="link" type="button" data-act="mode" data-m="signup" id="sw-signup" data-t="needAccount"></button>
      <button class="link" type="button" data-act="mode" data-m="signin" id="sw-signin" data-t="haveAccount"></button>
      <button class="link" type="button" data-act="mode" data-m="reset" id="sw-reset" data-t="forgot"></button>
    </div>
  </section>

  <div class="tabs" id="tabs" hidden>
    <button data-act="tab" data-v="clock" data-t="myClock"></button>
    <button data-act="tab" data-v="team" data-t="team"></button>
  </div>

  <section id="v-clock" hidden class="wrap">
    <div class="notice" id="hol-notice" role="status" hidden></div>
    <div class="card timecard">
      <div class="hello" id="clk-hello"></div>
      <div class="now" id="clk-now"></div>
      <div class="date" id="clk-date"></div>
      <div class="status" id="clk-status"></div>
      <button class="big in" id="btn-punch" data-act="punch"></button>
    </div>
    <div class="stats" id="clk-stats"></div>
    <div class="card">
      <h2 data-t="requestPto"></h2>
      <form id="f-pto">
        <label><span data-t="date"></span><input type="date" id="pto-date" required></label>
        <label><span data-t="hours"></span><input type="number" id="pto-hours" min="0.5" max="24" step="0.5" value="8" required></label>
        <label class="full"><span data-t="note"></span><input type="text" id="pto-note" maxlength="200"></label>
        <button class="primary full" data-t="send"></button>
      </form>
      <ul id="pto-list" style="margin-top:12px"></ul>
    </div>
    <div class="card">
      <h2 data-t="history"></h2>
      <ul id="hist"></ul>
    </div>
    <div class="card">
      <h2 data-t="holidays"></h2>
      <ul id="hol-list"></ul>
      <form id="f-hol" hidden style="margin-top:12px">
        <label><span data-t="date"></span><input type="date" id="hol-date" required></label>
        <label><span data-t="name"></span><input type="text" id="hol-name" maxlength="60" required></label>
        <button class="primary full" data-t="addHoliday"></button>
      </form>
    </div>
  </section>

  <section id="v-team" hidden class="wrap">
    <div class="card" id="team-card">
      <h2 data-t="team"></h2>
      <ul class="team" id="team-list"></ul>
    </div>
    <div id="detail" hidden class="wrap">
      <button data-act="back" data-t="back" style="align-self:flex-start"></button>
      <div class="card">
        <h2 id="d-name" style="color:var(--ink);font-size:24px;margin-bottom:2px"></h2>
        <p class="note" id="d-email" style="margin-bottom:10px"></p>
        <div id="d-status" style="display:flex;flex-wrap:wrap;gap:10px;align-items:center"></div>
        <div class="stats" id="d-stats" style="margin-top:12px"></div>
        <div style="margin-top:12px" id="d-role"></div>
      </div>
      <div class="card">
        <h2 data-t="ptoReqs"></h2>
        <ul id="d-pto"></ul>
        <form id="f-allow" style="margin-top:12px">
          <label class="full"><span data-t="allowance"></span><input type="number" id="allow" min="0" max="999" step="0.5" required></label>
          <button class="primary full" data-t="save"></button>
        </form>
      </div>
      <div class="card">
        <h2 data-t="shifts"></h2>
        <ul id="d-shifts"></ul>
        <h2 data-t="addShift" style="margin-top:16px"></h2>
        <form id="f-shift">
          <label class="full"><span data-t="date"></span><input type="date" id="sh-date" required></label>
          <label><span data-t="start"></span><input type="time" id="sh-in" required></label>
          <label><span data-t="end"></span><input type="time" id="sh-out" required></label>
          <button class="primary full" data-t="add"></button>
        </form>
      </div>
    </div>
  </section>
</div>
<div id="toast" role="status" aria-live="polite" hidden></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.113.0/dist/umd/supabase.js"></script>
<script>
if(!window.supabase){document.getElementById("msg").textContent="Couldn't load the sign-in system. Check your internet connection and reload. / No se pudo cargar. Revisa tu conexión y recarga.";throw new Error("supabase-js failed to load")}
// Public project URL + publishable key: safe in the browser, the database's row-level security does the protecting.
const SB_URL="https://jegfqjvrntiopfufhoxi.supabase.co";
const SB_KEY="sb_publishable_B_A8UAQMbDj5ZSitwRDlyg_oLdErUNR";
const sb=supabase.createClient(SB_URL,SB_KEY);

const T={

 needAccount:"New here? Create an account",haveAccount:"Already have an account? Sign in",forgot:"Forgot password?",
 sendLink:"Email me a reset link",setPass:"Save new password",

 linkSent:"If that email has an account, a reset link is on its way.",passSaved:"Password saved. You're signed in.",

es:{title:"Reloj de Tiempo",other:"English",loading:"Cargando…",myClock:"Mi reloj",team:"Equipo",signOut:"Salir",
 signIn:"Iniciar sesión",signUp:"Crear cuenta",resetH:"Restablecer contraseña",newPassH:"Elige una contraseña nueva",
 fullName:"Nombre completo",email:"Correo electrónico",password:"Contraseña (8+ caracteres)",
 needAccount:"¿Eres nuevo? Crea una cuenta",haveAccount:"¿Ya tienes cuenta? Inicia sesión",forgot:"¿Olvidaste tu contraseña?",
 sendLink:"Envíame un enlace",setPass:"Guardar contraseña",

 hello:"Hola, {n}",

let lang;try{lang=localStorage.getItem("tc-lang")}catch(e){}
if(!T[lang])lang=(navigator.language||"").startsWith("es")?"es":"en";
const t=(k,v={})=>T[lang][k].replace(/\{(\w)\}/g,(_,x)=>v[x]);
const loc=()=>lang==="es"?"es-MX":"en-US";
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

// ---- State machines ----
// Every flow in the app is one row here: state -> {EVENT: next state}. go() is the only code that changes
// state; an event with no entry for the current state is ignored (and logged with console.debug).
// The current states are mirrored on <body> as data-session, data-auth, data-nav, data-sync and data-busy
// (plus data-role and data-shift), and on window.timeclock, so tests and agents can read them.
const M={
  // Who is using the page. booting: checking for a saved sign-in. recovering: arrived from a reset-password email.
  session:{booting:{SIGNED_OUT:"signedOut",SIGNED_IN:"loading",RECOVERY:"recovering"},
           signedOut:{SIGNED_IN:"loading",RECOVERY:"recovering"},
           recovering:{PASSWORD_SET:"loading",SIGNED_OUT:"signedOut"},
           loading:{LOADED:"ready",FAILED:"loadError",SIGNED_OUT:"signedOut",RECOVERY:"recovering"},
           loadError:{RETRY:"loading",SIGNED_OUT:"signedOut"},
           ready:{SIGNED_OUT:"signedOut",RECOVERY:"recovering"}},
  // Which sign-in form is showing (while session is signedOut). recovering always shows the new-password form.
  auth:{signin:{SIGNUP:"signup",RESET:"reset"},signup:{SIGNIN:"signin"},reset:{SIGNIN:"signin"}},
  // Which screen is showing (while session is ready). team and person are admin only; S.sel is the open person.
  nav:{clock:{TEAM:"team"},team:{CLOCK:"clock",OPEN:"person"},person:{BACK:"team",TEAM:"team",CLOCK:"clock"}},
  // Whether the last background refresh worked. stale shows the "no connection" notice.
  sync:{ok:{FAIL:"stale"},stale:{OK:"ok"}},
  // One save at a time: a second tap or submit while saving is ignored.
  busy:{idle:{START:"saving"},saving:{DONE:"idle"}}};
// Two more machines live in the database, which has the final say; the page reads them and offers the allowed moves.
//   shift: out --clock('in')--> in --clock('out')--> out    (RPC clock(action,target); one open shift per person)
//   role:  employee <--> admin                               (admins only; the database refuses to remove the last admin)
// Time-off request: who may do what in each status. ptoRows() draws exactly these buttons.
const PTO={pending:{admin:["approved","denied"],me:["cancel"]},approved:{admin:["pending"],me:[]},denied:{admin:["pending"],me:[]}};
for(const m in M)for(const s in M[m])for(const e in M[m][s])console.assert(M[m][M[m][s][e]],"transition to unknown state",m,s,e);

const state={session:"booting",auth:"signin",nav:"clock",sync:"ok",busy:"idle"};
// Data and context. armed: the delete button waiting for its second tap ("delpunch:12").
const S={me:null,profile:null,admin:false,people:{},punches:[],pto:[],holidays:[],sel:null,armed:null};
const ENTER={ // what happens on arriving in a state
  "session.loading":()=>refresh(),
  "session.signedOut":()=>{Object.assign(S,{me:null,profile:null,admin:false,people:{},punches:[],pto:[],holidays:[],sel:null,armed:null});
    Object.assign(state,{auth:"signin",nav:"clock",sync:"ok"})}};
function go(m,ev){const from=state[m],to=M[m][from][ev];
  if(!to){console.debug(`[state] ${m}: ${ev} ignored in ${from}`);return false}
  state[m]=to;console.debug(`[state] ${m}: ${from} -> ${to} (${ev})`);
  if(ENTER[m+"."+to])ENTER[m+"."+to]();
  render();return true}

// ---- pure helpers ----
const DAY=864e5;
function weekStart(d=new Date()){const x=new Date(d);x.setHours(0,0,0,0);x.setDate(x.getDate()-((x.getDay()+6)%7));return +x}
function dayStart(d=new Date()){const x=new Date(d);x.setHours(0,0,0,0);return +x}
// punches: [{in:ms,out:ms|null}]; an open punch counts up to now
function hoursIn(punches,from,to,now=Date.now()){let ms=0;for(const p of punches)if(p.in>=from&&p.in<to)ms+=(p.out||now)-p.in;return ms/36e5}
function ptoUsed(pto,year){return pto.filter(p=>p.status==="approved"&&String(p.day).startsWith(year)).reduce((s,p)=>s+(+p.hours||0),0)}
const fh=h=>(Math.round(h*100)/100).toFixed(2);
const dur=ms=>{const m=Math.floor(ms/6e4);return Math.floor(m/60)+"h "+String(m%60).padStart(2,"0")+"m"};
const ftime=ms=>new Date(ms).toLocaleTimeString(loc(),{hour:"numeric",minute:"2-digit"});
const fday=d=>new Date(d).toLocaleDateString(loc(),{weekday:"short",month:"short",day:"numeric"});
const daysUntil=(iso,now=new Date())=>Math.round((new Date(iso+"T00:00")-dayStart(now))/DAY);
const isoDay=(d=new Date())=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
(()=>{const mon=weekStart(new Date(2026,9,21,15));console.assert(new Date(mon).getDay()===1&&new Date(mon).getDate()===19,"weekStart");
 console.assert(hoursIn([{in:mon+8*36e5,out:mon+16.5*36e5},{in:mon+20*36e5,out:null}],mon,mon+DAY,mon+21*36e5)===9.5,"hoursIn");
 console.assert(daysUntil("2026-11-26",new Date(2026,9,28,15))===29&&daysUntil("2026-10-28",new Date(2026,9,28,23))===0,"daysUntil");
 console.assert(ptoUsed([{day:"2026-03-01",hours:8,status:"approved"},{day:"2026-04-01",hours:8,status:"pending"}],"2026")===8,"ptoUsed")})();

// ---- per-person views of the loaded rows ----
const punchesOf=uid=>S.punches.filter(p=>p.uid===uid);
const openOf=uid=>S.punches.find(p=>p.uid===uid&&!p.out);
const ptoOf=uid=>S.pto.filter(p=>p.user_id===uid);
const nameOf=uid=>(S.people[uid]&&S.people[uid].full_name)||(S.people[uid]&&S.people[uid].email)||"—";

function toast(m){const el=$("toast");el.textContent=m;el.hidden=false;clearTimeout(toast.h);toast.h=setTimeout(()=>el.hidden=true,3200)}
function applyLang(){document.documentElement.lang=lang;
  document.querySelectorAll("[data-t]").forEach(el=>el.textContent=t(el.dataset.t));
  $("btn-lang").textContent=T[lang].other;render()}

// ---- auth ----
const authMode=()=>state.session==="recovering"?"newpass":state.auth;
const note=m=>$("a-note").textContent=m;
function renderAuth(){const m=authMode();
  $("auth-h").textContent=t({signin:"signIn",signup:"signUp",reset:"resetH",newpass:"newPassH"}[m]);
  $("a-submit").textContent=t({signin:"signIn",signup:"signUp",reset:"sendLink",newpass:"setPass"}[m]);
  $("lbl-name").hidden=m!=="signup";$("lbl-email").hidden=m==="newpass";$("lbl-pass").hidden=m==="reset";
  $("a-name").required=m==="signup";$("a-email").required=m!=="newpass";$("a-pass").required=m!=="reset";
  $("a-pass").autocomplete=m==="signin"?"current-password":"new-password";
  $("sw-signup").hidden=m!=="signin";$("sw-signin").hidden=m==="signin";$("sw-reset").hidden=m!=="signin"}
$("f-auth").addEventListener("submit",async ev=>{ev.preventDefault();
  const mode=authMode(),email=$("a-email").value.trim(),pass=$("a-pass").value,btn=$("a-submit"),to=location.origin+location.pathname;
  const down=e=>!e.status||e.status>=500; // no answer from the server: say so instead of blaming the password
  const fail=e=>note(down(e)?t("offline"):e.code==="email_not_confirmed"?t("confirmFirst"):mode==="signin"&&e.status<429?t("badLogin"):e.message);
  btn.disabled=true;note("");
  try{
    if(mode==="signin"){const{error}=await sb.auth.signInWithPassword({email,password:pass});if(error)fail(error)}
    else if(mode==="signup"){const{data,error}=await sb.auth.signUp({email,password:pass,options:{data:{full_name:$("a-name").value.trim()},emailRedirectTo:to}});
      if(error)fail(error);else if(!data.session){go("auth","SIGNIN");note(t("checkEmail"))}}
    else if(mode==="reset"){const{error}=await sb.auth.resetPasswordForEmail(email,{redirectTo:to});
      if(error&&down(error))fail(error);else{go("auth","SIGNIN");note(t("linkSent"))}}
    else{const{error}=await sb.auth.updateUser({password:pass});
      if(error)fail(error);else{toast(t("passSaved"));go("session","PASSWORD_SET")}}
  }catch(e){note(t("offline"))}
  btn.disabled=false});

// ---- data ----
async function load(){
  const me=S.me,since=new Date(Date.now()-90*DAY).toISOString();
  const [pr,pu,pt,ho]=await Promise.all([
    sb.from("profiles").select("id,full_name,email,role,pto_allowance"),
    sb.from("punches").select("id,user_id,clock_in,clock_out,manual").gte("clock_in",since).order("clock_in",{ascending:false}).limit(5000),
    sb.from("pto_requests").select("id,user_id,day,hours,note,status").order("day",{ascending:false}),
    sb.from("holidays").select("day,name").gte("day",isoDay()).order("day")]);
  const err=pr.error||pu.error||pt.error||ho.error;if(err)throw err;
  if(S.me!==me)return; // signed out or switched account while loading: drop this answer
  S.people={};pr.data.forEach(p=>S.people[p.id]=p);
  S.profile=S.people[S.me];S.admin=!!(S.profile&&S.profile.role==="admin");
  S.punches=pu.data.map(p=>({id:p.id,uid:p.user_id,in:Date.parse(p.clock_in),out:p.clock_out?Date.parse(p.clock_out):null,manual:p.manual}));
  S.pto=pt.data;S.holidays=ho.data}
// The only caller of load(): sends the outcome to the right machine. First load failing is a full-screen
// error with a retry; a later refresh failing keeps the last data on screen and shows the "no connection" notice.
async function refresh(){
  try{await load();go("sync","OK");if(!S.admin)go("nav","CLOCK");go("session","LOADED")}
  catch(e){console.warn(e);if(state.session==="loading")go("session","FAILED");else go("sync","FAIL")}
  render()}
async function act(fn,ok){if(!go("busy","START"))return false;
  try{const r=await fn();if(r&&r.error)throw r.error;if(ok)toast(ok);await refresh();return r||true}
  catch(e){console.warn(e);toast(t("err"));return false}
  finally{go("busy","DONE")}}
// Says which way to go instead of toggling, so a stale screen or a second device can never flip the wrong way.
async function clock(action,target){const r=await act(()=>sb.rpc("clock",target?{action,target}:{action}));
  if(r&&r.data)toast(target?t("saved"):t({in:"punchedIn",out:"punchedOut",already_in:"alreadyIn",already_out:"alreadyOut"}[r.data]||"saved",{t:ftime(Date.now())}))}

// ---- render ----
function statsHtml(uid){const ws=weekStart(),pu=punchesOf(uid),y=String(new Date().getFullYear());
  const left=(+(S.people[uid]||{}).pto_allowance||0)-ptoUsed(ptoOf(uid),y);
  return [[t("today"),hoursIn(pu,dayStart(),dayStart()+DAY)],[t("thisWeek"),hoursIn(pu,ws,ws+7*DAY)],[t("ptoLeft"),left]]
   .map(([l,v])=>`<div class="stat"><b>${fh(v)}</b><span>${esc(l)} (${t("hrs")})</span></div>`).join("")}
const delBtn=(a,id)=>{const on=S.armed===a+":"+id;return `<button class="small danger${on?" armed":""}" data-act="${a}" data-id="${esc(id)}">${t(on?"sure":"del")}</button>`};
function shiftRows(list,canDel){const done=list.filter(p=>p.out);if(!done.length)return `<p class="empty">${t("noShifts")}</p>`;
  return done.map(p=>`<li><div class="main"><b>${esc(fday(p.in))}</b><div class="sub">${ftime(p.in)} – ${ftime(p.out)}${p.manual?" ✎":""}</div></div>
   <span class="num">${fh((p.out-p.in)/36e5)}</span>${canDel?delBtn("delpunch",p.id):""}</li>`).join("")}
const PTO_LABEL={approved:"approve",denied:"deny",pending:"undo",cancel:"cancel"};
function ptoRows(list,mode){if(!list.length)return mode==="admin"?`<p class="empty">${t("noPto")}</p>`:"";
  return list.slice(0,mode==="admin"?60:6).map(p=>{
   const btns=((PTO[p.status]||{})[mode]||[]).map(a=>`<button class="small${a==="denied"?" danger":""}" data-act="${a==="cancel"?"ptocancel":"ptoset"}" data-s="${a}" data-id="${p.id}">${t(PTO_LABEL[a])}</button>`).join("");
   return `<li><div class="main"><b>${esc(fday(p.day+"T00:00"))}</b> <span class="num">· ${fh(+p.hours)} ${t("hrs")}</span>
     <div class="sub">${esc(p.note)}</div></div><span class="pill ${esc(p.status)}">${t(p.status)}</span><div class="row-btns">${btns}</div></li>`}).join("")}

// Draws the whole page from the machines: which screen shows depends only on `state`.
function render(){const s=state.session,app=s==="ready";
  Object.assign(document.body.dataset,state,{role:app?(S.admin?"admin":"employee"):"",shift:app?(openOf(S.me)?"in":"out"):""});
  $("msg").hidden=!(s==="booting"||s==="loading");$("v-auth").hidden=!(s==="signedOut"||s==="recovering");$("v-error").hidden=s!=="loadError";
  $("btn-out").hidden=!app;$("tabs").hidden=!(app&&S.admin);$("sync-notice").hidden=!(app&&state.sync==="stale");
  $("v-clock").hidden=!(app&&state.nav==="clock");$("v-team").hidden=!(app&&state.nav!=="clock");
  renderAuth();if(app)renderApp()}

function renderApp(){
  document.querySelectorAll("#tabs button").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.v===(state.nav==="clock"?"clock":"team"))));
  const open=openOf(S.me),b=$("btn-punch");
  b.textContent=open?t("clockOut"):t("clockIn");b.className="big "+(open?"out":"in");b.disabled=state.busy==="saving";
  $("clk-hello").textContent=t("hello",{n:(S.profile&&S.profile.full_name)||""});
  tick();
  $("clk-stats").innerHTML=statsHtml(S.me);
  $("pto-list").innerHTML=ptoRows(ptoOf(S.me),"me");
  $("hist").innerHTML=shiftRows(punchesOf(S.me).slice(0,11),false);
  const longDay=d=>new Date(d+"T00:00").toLocaleDateString(loc(),{weekday:"long",month:"long",day:"numeric"});
  const nx=S.holidays[0],nn=$("hol-notice");nn.hidden=!nx;
  if(nx){const n=daysUntil(nx.day);
    nn.innerHTML=n===0?esc(t("offToday",{n:nx.name}))
      :`<b>${n===1?"1":n}</b><div>${esc(t("nextOff",{n:nx.name}))}<div class="sub">${esc(n===1?t("tomorrow")+" · "+longDay(nx.day):longDay(nx.day)+" · "+n+" "+t("inDays"))}</div></div>`}
  $("hol-list").innerHTML=S.holidays.length?S.holidays.map(h=>`<li><div class="main"><b>${esc(h.name)}</b><div class="sub">${esc(new Date(h.day+"T00:00").toLocaleDateString(loc(),{weekday:"long",month:"long",day:"numeric",year:"numeric"}))}</div></div>
    <span class="pill approved">${t("dayOff")}</span>${S.admin?delBtn("delhol",h.day):""}</li>`).join(""):`<p class="empty">${t("noHolidays")}</p>`;
  $("f-hol").hidden=!S.admin;
  if(S.admin)renderTeam()}

function renderTeam(){const ids=Object.keys(S.people).sort((a,c)=>nameOf(a).localeCompare(nameOf(c))),ws=weekStart(),person=state.nav==="person";
  $("team-card").hidden=person;$("detail").hidden=!person;
  $("team-list").innerHTML=ids.length>1||ids[0]!==S.me?ids.map(id=>{const pu=punchesOf(id),on=openOf(id),pend=ptoOf(id).filter(p=>p.status==="pending").length,adm=S.people[id].role==="admin";
    return `<li data-act="open" data-id="${esc(id)}" tabindex="0" role="button"><div class="main"><b>${esc(nameOf(id))}</b>${adm?` <span class="pill">${t("admin")}</span>`:""}
     <div class="sub">${t("thisWeek")}: <span class="num">${fh(hoursIn(pu,ws,ws+7*DAY))}</span> · ${t("lastWeek")}: <span class="num">${fh(hoursIn(pu,ws-7*DAY,ws))}</span>
     ${pend?` · <span class="pill pending">${esc(t("pendingN",{n:pend}))}</span>`:""}</div></div>
     <span class="pill ${on?"on":""}">${on?t("in"):t("out")}</span></li>`}).join(""):`<p class="empty">${t("emptyTeam")}</p>`;
  if(!person)return;
  const p=S.people[S.sel];if(!p){go("nav","BACK");return} // the open person's account is gone
  const on=openOf(S.sel);
  $("d-name").textContent=nameOf(S.sel);$("d-email").textContent=p.email||"";
  $("d-status").innerHTML=`<span class="pill ${on?"on":""}">${on?t("in"):t("out")}</span>${on?`<span>${esc(t("onSince",{t:ftime(on.in),d:dur(Date.now()-on.in)}))}</span>
    <button class="small danger" data-act="forceout">${t("forceOut")}</button>`:""}`;
  $("d-stats").innerHTML=statsHtml(S.sel);
  $("d-role").innerHTML=S.sel===S.me?"":`<button class="small" data-act="role">${p.role==="admin"?t("makeEmp"):t("makeAdmin")}</button>`;
  $("d-pto").innerHTML=ptoRows(ptoOf(S.sel),"admin");
  $("d-shifts").innerHTML=shiftRows(punchesOf(S.sel),true)}

function tick(){const n=new Date();$("clk-now").textContent=n.toLocaleTimeString(loc(),{hour:"numeric",minute:"2-digit"});
  $("clk-date").textContent=n.toLocaleDateString(loc(),{weekday:"long",month:"long",day:"numeric"});
  const on=S.me&&openOf(S.me);$("clk-status").textContent=on?t("onSince",{t:ftime(on.in),d:dur(Date.now()-on.in)}):t("off")}
setInterval(()=>{if(state.session==="ready"){tick();if(state.nav!=="clock")renderTeam()}},30000);
const background=()=>{if(state.session==="ready"&&state.busy==="idle"&&!document.hidden)refresh()};
setInterval(background,120000);
document.addEventListener("visibilitychange",background);
window.addEventListener("online",background);

// Delete needs two taps on the same button within 3 seconds. The armed button is state, so a redraw keeps it.
function confirmed(key){clearTimeout(confirmed.h);
  if(S.armed===key){S.armed=null;return true}
  S.armed=key;confirmed.h=setTimeout(()=>{S.armed=null;render()},3000);render();return false}

document.addEventListener("click",ev=>{const b=ev.target.closest("[data-act]");if(!b)return;const a=b.dataset.act,id=b.dataset.id;
  if(a==="lang"){lang=lang==="en"?"es":"en";try{localStorage.setItem("tc-lang",lang)}catch(e){}applyLang()}
  else if(a==="mode"){note("");if(state.session==="recovering")sb.auth.signOut();else go("auth",b.dataset.m.toUpperCase())}
  else if(a==="signout")sb.auth.signOut();
  else if(a==="retry")go("session","RETRY");
  else if(a==="tab")go("nav",b.dataset.v.toUpperCase());
  else if(a==="punch")clock(openOf(S.me)?"out":"in");
  else if(a==="open"){S.sel=id;$("allow").value=S.people[id].pto_allowance||0;$("sh-date").value=isoDay();go("nav","OPEN");scrollTo(0,0)}
  else if(a==="back")go("nav","BACK");
  else if(a==="forceout")clock("out",S.sel);
  else if(a==="role")act(()=>sb.from("profiles").update({role:S.people[S.sel].role==="admin"?"employee":"admin"}).eq("id",S.sel),t("saved"));
  else if(a==="ptoset")act(()=>sb.from("pto_requests").update({status:b.dataset.s,decided_by:b.dataset.s==="pending"?null:S.me}).eq("id",id),t("saved"));
  else if(a==="ptocancel")act(()=>sb.from("pto_requests").delete().eq("id",id));
  else if(a==="delpunch"&&confirmed(a+":"+id))act(()=>sb.from("punches").delete().eq("id",id),t("saved"));
  else if(a==="delhol"&&confirmed(a+":"+id))act(()=>sb.from("holidays").delete().eq("day",id),t("saved"))});
document.addEventListener("keydown",ev=>{if(ev.key==="Enter"&&ev.target.matches("li[data-act]"))ev.target.click()});

$("f-pto").addEventListener("submit",async ev=>{ev.preventDefault();
  const ok=await act(()=>sb.from("pto_requests").insert({day:$("pto-date").value,hours:+$("pto-hours").value,note:$("pto-note").value.trim()||null}),t("sent"));
  if(ok){$("pto-note").value="";$("pto-date").value=""}});
$("f-allow").addEventListener("submit",ev=>{ev.preventDefault();act(()=>sb.from("profiles").update({pto_allowance:+$("allow").value}).eq("id",S.sel),t("saved"))});
$("f-hol").addEventListener("submit",async ev=>{ev.preventDefault();
  if(await act(()=>sb.from("holidays").upsert({day:$("hol-date").value,name:$("hol-name").value.trim()}),t("saved"))){$("hol-name").value="";$("hol-date").value=""}});
$("f-shift").addEventListener("submit",ev=>{ev.preventDefault();
  const d=$("sh-date").value,i=new Date(d+"T"+$("sh-in").value),o=new Date(d+"T"+$("sh-out").value);
  if(o<=i)o.setDate(o.getDate()+1);// overnight shift
  if(o-i>16*36e5)return toast(t("badShift"));
  act(()=>sb.from("punches").insert({user_id:S.sel,clock_in:i.toISOString(),clock_out:o.toISOString(),manual:true}),t("saved"))});

// ---- sign-in events -> session machine ----
// Remember who signed in (unless a screen is already showing their data), then send the event.
function onSession(session,ev){if(session&&state.session!=="ready"&&state.session!=="loading")S.me=session.user.id;go("session",ev)}
// setTimeout: Supabase must not be called from inside its own auth callback.
sb.auth.onAuthStateChange((evt,session)=>setTimeout(()=>{
  if(evt==="PASSWORD_RECOVERY")onSession(session,"RECOVERY");
  else if(evt==="SIGNED_OUT")go("session","SIGNED_OUT");
  else if(session)onSession(session,"SIGNED_IN")})); // INITIAL_SESSION, SIGNED_IN, TOKEN_REFRESHED, USER_UPDATED
applyLang();
sb.auth.getSession().then(({data:{session}})=>onSession(session,session?"SIGNED_IN":"SIGNED_OUT"),()=>go("session","SIGNED_OUT"));
</script>
